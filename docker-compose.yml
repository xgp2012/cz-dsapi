# ---------------------------------------------------------------------------
# cz-dsapi —— Docker Compose 部署
#
# 快速开始：
#   1. cp .env.compose.example .env   然后填 CZ_API_KEY（必填）和 token
#   2. docker compose up -d
#   3. 打开 http://<宿主机IP>:8787/admin/
#
# 也可以跳过第 1 步直接 up：此时 compose 会因为缺 CZ_API_KEY 而拒绝启动，
# 并提示你去设置 —— 这是有意的，容器默认监听 0.0.0.0，不能让没 key 的实例跑起来。
# 想先不设 key 试跑，就临时用：CZ_API_KEY=dev docker compose up -d
#
# 注意：容器内 /app 是只读的，控制台「设置」页无法写回 .env。
#       所有配置都必须通过下面的 environment 传入 —— 改完 docker compose up -d 生效。
# ---------------------------------------------------------------------------

services:
  cz-dsapi:
    image: ghcr.io/xgp2012/cz-dsapi:latest
    # 想用本地源码构建就把上面换成本段（需要本机有 docker）：
    # build: .
    container_name: cz-dsapi
    restart: unless-stopped

    ports:
      # 左边是宿主机端口，改了之后控制台地址也要跟着改
      # 只想本机访问就写 "127.0.0.1:8787:8787"
      - "8787:8787"

    # environment 用「列表 + KEY=VALUE」写法。
    # 另一种合法写法是映射（KEY: VALUE），但两者**不能混用** ——
    # 混用会让整段 environment 退化成字符串，报 "expected <block end>, but found '<scalar>'"。
    environment:
      # ---------------------------------------------------------------------
      # 这里刻意只保留「必须在容器启动前确定」的项。
      #
      # 其余所有可调配置（引擎、并发、超时、深度思考、浏览器参数…共 51 项）
      # 都请在**控制台「设置」页**改 —— 保存在数据卷的 settings.json 里，
      # 重启服务即生效。网页设置的优先级高于这里的 environment，
      # 所以即便你在下面也写了同名项，网页上的值最终仍会胜出。
      #
      # 保留在这里的三类：
      #   1. API_KEY / token：属于凭据，不该出现在可被网页覆盖的明文文件里；
      #   2. PORT / HOST / DATA_DIR：容器端口映射与卷位置，改了必须重建容器；
      #   3. TZ：进程启动时就决定，网页改它没有意义。
      # ---------------------------------------------------------------------

      # ------------------------------ 必填 ------------------------------
      # ⚠️ API_KEY：容器默认监听 0.0.0.0，等于对所有能访问该端口的人开放。
      #    留空 = 任何人拿到地址就能白嫖你的号池额度。请务必改成强随机串。
      #    生成：openssl rand -hex 24
      - API_KEY=${CZ_API_KEY:?请设置 CZ_API_KEY，例如在 .env 里写 CZ_API_KEY=xxx}

      # 登录态（二选一，或都留空走控制台的「账号」页粘贴）
      - DEEPSEEK_USER_TOKEN=${CZ_USER_TOKEN:-}
      - DEEPSEEK_USER_TOKENS=${CZ_USER_TOKENS:-}

      # ---------------------------- 容器基础 ----------------------------
      - TZ=Asia/Shanghai

    volumes:
      # 号池（auth.json）、日志、截图产物都在这里。
      # ⚠️ 别省：不挂卷重建容器，号池就丢了，得重新粘一遍 token。
      - cz-data:/app/data

    # ✅ 关键：必须 > SHUTDOWN_TIMEOUT_MS，给优雅关闭留出时间。
    #    默认 10s 也能工作，这里显式写出来是为了让两者的关系一目了然。
    stop_grace_period: 15s

    healthcheck:
      # 镜像自带 HEALTHCHECK，这里再写一遍是为了让 compose 的 depends_on 能引用
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # 日志轮转：不限制的话 docker logs 能涨到几个 G，把宿主机磁盘吃满
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    # ---------------------------- 资源限制（可选） ----------------------------
    # 直连引擎不吃内存；browser 引擎每个 Chromium 约 200-400MB，
    # 用 ENGINE=browser 时把 mem_limit 提到 2g 以上，并把 CONCURRENCY 降到 1-2。
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g

    # ---------------------------- 网络（可选） ----------------------------
    # 要让容器访问宿主机上的代理（BROWSER_ARGS=--proxy-server=...）时打开：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  # 命名卷。想指定落盘位置（比如放到大盘上）就改成 bind 形式：
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: /srv/cz-dsapi/data
  cz-data: {}
